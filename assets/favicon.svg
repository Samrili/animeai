<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1320" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Sleek Neon Border Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2646" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00ebff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Parallelogram Brand Crimson Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2646" />
      <stop offset="100%" stop-color="#99001e" />
    </linearGradient>

    <!-- Glow Filter for Pulse -->
    <filter id="neonPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Squircle Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2" />

  <!-- Dynamic Angled Brand Badge (Exact RingPulse Parallelogram) -->
  <polygon points="19,13 53,13 45,49 11,49" fill="url(#brandGrad)" />

  <!-- RP Monogram (Geometric, Sharp & Centered) -->
  <!-- R -->
  <path d="M 20,20 L 28.5,20 C 32,20 33.8,21.8 33.8,25 C 33.8,27.8 32,29.6 28.8,30 L 33.2,42 L 29.2,42 L 25.2,31.2 L 23.4,31.2 L 23.4,42 L 20,42 Z M 23.4,23.2 L 23.4,28.4 L 28,28.4 C 29.8,28.4 30.6,27.4 30.6,25.8 C 30.6,24.2 29.8,23.2 28,23.2 Z" fill="#ffffff" />
  
  <!-- P -->
  <path d="M 35,20 L 43.5,20 C 47,20 48.8,21.8 48.8,25 C 48.8,28.2 47,30.2 43.5,30.2 L 38.4,30.2 L 38.4,42 L 35,42 Z M 38.4,23.2 L 38.4,27.4 L 43,27.4 C 44.8,27.4 45.6,26.4 45.6,25.3 C 45.6,24.1 44.8,23.2 43,23.2 Z" fill="#ffffff" />

  <!-- Neon Cyan Pulse Wave Accent -->
  <polyline points="9,45 19,45 23,39 27,51 31,43 35,47 55,47" stroke="#00ebff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonPulse)" />
</svg>
